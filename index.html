<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signature Cleaner</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    canvas {
      border: 1px solid #ccc;
      margin-top: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    input[type="range"] {
      width: 300px;
    }

    #overlayDropZone {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background-color: rgba(0, 0, 0, 0.05);
      display: none;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 24px;
      pointer-events: none;
    }

    #overlayDropZone.active {
      display: flex;
      pointer-events: all;
      border: 4px dashed #888;
    }

    #controls {
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div id="overlayDropZone">Drop image here</div>

  <div id="controls">
    <h2>Signature Cleaner (Drag Anywhere)</h2>
    <input type="file" id="fileInput" accept="image/*"><br><br>

    <label for="thresholdRange">Threshold: <span id="thresholdValue">220</span></label><br>
    <input type="range" id="thresholdRange" min="0" max="255" value="220"><br>

    <canvas id="canvas"></canvas><br>
    <button id="downloadBtn">Download PNG</button>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const thresholdRange = document.getElementById('thresholdRange');
    const thresholdValue = document.getElementById('thresholdValue');
    const downloadBtn = document.getElementById('downloadBtn');
    const overlay = document.getElementById('overlayDropZone');

    let originalImage = null;

    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    thresholdRange.addEventListener('input', () => {
      thresholdValue.textContent = thresholdRange.value;
      if (originalImage) {
        drawThresholdedImage(originalImage, parseInt(thresholdRange.value));
      }
    });

    function handleFile(file) {
      const reader = new FileReader();
      const img = new Image();

      reader.onload = function (event) {
        img.onload = function () {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
          drawThresholdedImage(originalImage, parseInt(thresholdRange.value));
        };
        img.src = event.target.result;
      };

      reader.readAsDataURL(file);
    }

    function drawThresholdedImage(imageData, threshold) {
      const newImage = new ImageData(imageData.width, imageData.height);
      for (let i = 0; i < imageData.data.length; i += 4) {
        const r = imageData.data[i];
        const g = imageData.data[i + 1];
        const b = imageData.data[i + 2];
        const avg = (r + g + b) / 3;
        const value = avg < threshold ? 0 : 255;
        newImage.data[i] = newImage.data[i + 1] = newImage.data[i + 2] = value;
        newImage.data[i + 3] = 255; // alpha
      }
      ctx.putImageData(newImage, 0, 0);
    }

    // Global drag and drop
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      overlay.classList.add('active');
    });

    window.addEventListener('dragleave', (e) => {
      if (e.target === document || e.target === document.body) {
        overlay.classList.remove('active');
      }
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      overlay.classList.remove('active');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'cleaned_signature.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  </script>

</body>
</html>
